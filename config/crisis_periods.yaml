# =============================================================================
# Crisis Periods Definition
# =============================================================================

pre_crisis_window_days: 63

crises:

  - id: "gfc_2008"
    name: "Global Financial Crisis"
    short_name: "GFC"
    crisis_start: "2008-09-15"
    crisis_end:   "2009-03-31"
    severity: "extreme"
    markets_affected: ["sp500", "nifty50", "bovespa"]
    notes: "Triggered by US subprime mortgage collapse. Global contagion."

  - id: "euro_debt_2011"
    name: "European Debt Crisis"
    short_name: "Euro Debt"
    crisis_start: "2011-07-01"
    crisis_end:   "2012-01-31"
    severity: "high"
    markets_affected: ["sp500", "nifty50", "bovespa"]
    notes: "Sovereign debt stress in Greece, Italy, Spain."

  - id: "taper_tantrum_2013"
    name: "Taper Tantrum"
    short_name: "Taper"
    crisis_start: "2013-05-22"
    crisis_end:   "2013-09-18"
    severity: "moderate"
    markets_affected: ["sp500", "nifty50", "bovespa"]
    notes: "Fed taper signal caused sharp EM capital outflows."

  - id: "china_shock_2015"
    name: "China Market Shock"
    short_name: "China Shock"
    crisis_start: "2015-06-12"
    crisis_end:   "2016-02-11"
    severity: "high"
    markets_affected: ["sp500", "nifty50", "bovespa"]
    notes: "Shanghai Composite crashed 30%+. CNY devaluation Aug 2015."

  - id: "covid_2020"
    name: "COVID-19 Pandemic Crash"
    short_name: "COVID"
    crisis_start: "2020-02-19"
    crisis_end:   "2020-04-30"
    severity: "extreme"
    markets_affected: ["sp500", "nifty50", "bovespa"]
    notes: "Fastest bear market in history. Global synchronised crash."

  - id: "inflation_hike_2022"
    name: "Inflation and Rate Hike Shock"
    short_name: "Rate Hike"
    crisis_start: "2022-01-03"
    crisis_end:   "2022-10-12"
    severity: "high"
    markets_affected: ["sp500", "nifty50", "bovespa"]
    notes: "Fastest Fed tightening cycle since 1980s."

tranquil_periods:

  - id: "tranquil_2012_2013"
    name: "Post-Euro Recovery"
    start: "2012-04-01"
    end:   "2013-04-30"

  - id: "tranquil_2016_2017"
    name: "Post-China Shock Recovery"
    start: "2016-07-01"
    end:   "2017-12-31"

  - id: "tranquil_2021"
    name: "Post-COVID Recovery Bull Market"
    start: "2021-01-01"
    end:   "2021-11-30"
