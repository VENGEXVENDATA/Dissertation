# =============================================================================
# Dissertation Project Settings
# Temporal Community Stability in Stock Networks
# University of Edinburgh — MSc Data Science
# =============================================================================

project:
  title: "Temporal Community Stability in Stock Networks"
  author: "MSc Candidate — University of Edinburgh"
  version: "1.0.0"

data:
  start_date: "2010-01-01"
  end_date:   "2024-12-31"
  price_field: "Adj Close"
  raw_dir:       "data/raw"
  processed_dir: "data/processed"
  graphs_dir:    "data/graphs"
  metadata_dir:  "data/metadata"

markets:
  sp500:
    name: "S&P 500"
    country: "USA"
    type: "developed"
    currency: "USD"
    timezone: "America/New_York"
    metadata_file: "data/metadata/sp500_constituents.csv"
  nifty50:
    name: "NIFTY 50"
    country: "India"
    type: "emerging"
    currency: "INR"
    timezone: "Asia/Kolkata"
    metadata_file: "data/metadata/nifty50_constituents.csv"
  bovespa:
    name: "Bovespa (IBOVESPA)"
    country: "Brazil"
    type: "emerging"
    currency: "BRL"
    timezone: "America/Sao_Paulo"
    metadata_file: "data/metadata/bovespa_constituents.csv"

windows:
  primary: 126
  sensitivity:
    - 63
    - 252
  step: 21

network:
  method_primary: "pmfg"
  method_secondary: "mst"
  weight_formula: "inverse_distance"

community:
  # Primary Community Algorithm Dispatcher
  # Supported Choices Across 5 Theoretical Families:
  #  1. "louvain"  -> Modularity Maximization (Primary Benchmark)
  #  2. "leiden"   -> Refined Modularity Maximization (Traag et al.)
  #  3. "infomap"  -> Information Theory & Random Walk Compression
  #  4. "lpa"      -> Local Label Propagation Consensus Dynamics
  #  5. "spectral" -> Spectral Decomposition & Laplacian Eigenvectors
  #  6. "hac"      -> Hierarchical Agglomerative Distance Clustering
  algorithm_primary: "leiden"
  algorithm_secondary: "louvain"
  
  # Consensus Parameters (Used by Louvain & Leiden)
  consensus_runs: 100
  resolution: 1.0
  random_seed_start: 42

stability:
  metric_primary: "ari"
  metric_secondary: "nmi"
  rolling_windows:
    - 63
    - 126

quality:
  max_missing_pct: 0.10
  max_forward_fill_days: 3
  min_trading_days: 1000
  zero_return_streak_flag: 5

logging:
  level: "INFO"
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
  log_dir: "logs"